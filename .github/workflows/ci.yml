name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --workspace --lib --bins -- -D warnings

      - name: Workspace tests (unit, integration, snapshots, harness)
        run: cargo test --locked --workspace

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            target/**/*.snap.new
            libs/**/*.snap.new
            target/**/harness-artifacts/**
            tmp/harness-artifacts/**
            target/**/insta/**
            **/ratagit.log
