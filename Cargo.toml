[package]
name = "ratagit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = { version = "3.6", default-features = false }
shell-words = "1.1"
crossterm.workspace = true
ratagit-core.workspace = true
ratagit-git.workspace = true
ratagit-harness.workspace = true
ratagit-observe.workspace = true
ratagit-testkit.workspace = true
ratagit-ui.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true

[workspace]
default-members = [
    ".",
    "libs/ratagit-core",
    "libs/ratagit-git",
    "libs/ratagit-harness",
    "libs/ratagit-observe",
    "libs/ratagit-testkit",
    "libs/ratagit-ui",
]
members = [
    "libs/ratagit-core",
    "libs/ratagit-git",
    "libs/ratagit-harness",
    "libs/ratagit-observe",
    "libs/ratagit-testkit",
    "libs/ratagit-ui",
]
resolver = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
crossterm = "0.29"
git2 = "0.20.4"
insta = "1"
ratagit-core = { path = "libs/ratagit-core" }
ratagit-git = { path = "libs/ratagit-git" }
ratagit-harness = { path = "libs/ratagit-harness" }
ratagit-observe = { path = "libs/ratagit-observe" }
ratagit-testkit = { path = "libs/ratagit-testkit" }
ratagit-ui = { path = "libs/ratagit-ui" }
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
redundant_clone = "deny"
needless_collect = "deny"
large_enum_variant = "warn"

[profile.profiling]
inherits = "release"
debug = "full"
strip = false
codegen-units = 16
lto = false
