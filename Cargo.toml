[package]
name = "ratagit"
version = "0.1.0"
edition = "2021"
authors = ["lpcv5 <lpengcheng149@gmail.com>"]
license = "MIT"
description = "A fast, intuitive terminal UI for Git"
repository = "https://github.com/lpcv5/ratagit"
keywords = ["git", "tui", "terminal", "ratatui"]
categories = ["command-line-interface", "development-tools"]

[dependencies]
# UI framework
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
crossterm = "0.29"

# Git operations
git2 = "0.19"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Error handling
thiserror = "1.0"
color-eyre = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
regex = "1.10"

[dev-dependencies]
# Testing
tempfile = "3.10"
pretty_assertions = "1.4"

[target.'cfg(unix)'.dev-dependencies]
# Real PTY lifecycle checks without opening the user's terminal.
libc = "0.2"

[profile.release]
# Optimize release build
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[profile.dev]
# Optimize dev build settings
opt-level = 0
debug = true

# Keep release optimization while retaining symbols for latency investigations.
[profile.profiling]
inherits = "release"
debug = "full"
strip = false
codegen-units = 16
lto = false
panic = "unwind"
